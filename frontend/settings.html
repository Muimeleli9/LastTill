<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LastTill | Settings</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">

            <a href="dashboard.html" class="brand">
                <div class="brand-logo">L</div>
                <div class="brand-name">LastTill</div>
            </a>

            <nav class="sidebar-nav">

                <a href="dashboard.html" class="nav-link">
                    <i data-lucide="layout-dashboard"></i>
                    Dashboard
                </a>

                <a href="expense.html" class="nav-link">
                    <i data-lucide="circle-plus"></i>
                    Add Expense
                </a>

                <a href="budget.html" class="nav-link">
                    <i data-lucide="wallet-cards"></i>
                    Budget
                </a>

                <a href="tillcheck.html" class="nav-link">
                    <i data-lucide="circle-check-big"></i>
                    TillCheck
                </a>

                <a href="savings.html" class="nav-link">
                    <i data-lucide="target"></i>
                    Savings Goal
                </a>

                <a href="emergency.html" class="nav-link">
                    <i data-lucide="shield-plus"></i>
                    Emergency Fund
                </a>

            </nav>


            <div class="profile-menu-wrapper">

                <button class="sidebar-profile" id="profileButton">

                    <div class="profile-avatar">R</div>

                    <div class="profile-details">
                        <strong>Rita Nkosi</strong>
                        <span>Student</span>
                    </div>

                    <i data-lucide="chevron-up" class="profile-chevron"></i>

                </button>

                <div class="profile-dropdown" id="profileDropdown">

                    <a href="profile.html">
                        <i data-lucide="user"></i>
                        Profile
                    </a>

                    <a href="settings.html">
                        <i data-lucide="settings"></i>
                        Settings
                    </a>

                    <a href="index.html" class="logout-link">
                        <i data-lucide="log-out"></i>
                        Log Out
                    </a>

                </div>

            </div>

        </aside>


        <main class="app-main">

            <header class="page-header">

                <div class="page-title">
                    <p class="eyebrow">Preferences</p>
                    <h1>Settings</h1>
                    <p>
                        Control how LastTill works for your account.
                    </p>
                </div>

            </header>


            <section class="content-grid-2">

                <article class="card">

                    <div class="card-heading">

                        <div>
                            <p class="card-label">Account</p>
                            <h3>Account Settings</h3>
                        </div>

                        <div class="card-icon">
                            <i data-lucide="user-cog"></i>
                        </div>

                    </div>

                    <div class="form-group">
                        <label>Account type</label>

                        <select class="form-control">
                            <option selected>Student</option>
                            <option>Employed</option>
                            <option>Entrepreneur</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-top:18px;">
                        <label>Currency</label>

                        <select class="form-control">
                            <option selected>ZAR — South African Rand (R)</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-top:18px;">
                        <label>Monthly cycle</label>

                        <select class="form-control">
                            <option selected>1st to month-end</option>
                            <option>Salary date to next salary date</option>
                        </select>
                    </div>

                </article>


                <article class="card card-green">

                    <div class="card-heading">

                        <div>
                            <p class="card-label">Notifications</p>
                            <h3>Money Alerts</h3>
                        </div>

                        <div class="card-icon">
                            <i data-lucide="bell-ring"></i>
                        </div>

                    </div>


                    <label style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:16px;
                        padding:16px 0;
                        border-bottom:1px solid #e5ece3;
                    ">

                        <div>
                            <strong>Budget warnings</strong>
                            <p style="
                                margin-top:4px;
                                font-size:12px;
                                color:#718074;
                            ">
                                Warn me when a category is almost full.
                            </p>
                        </div>

                        <input type="checkbox" checked>

                    </label>


                    <label style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:16px;
                        padding:16px 0;
                        border-bottom:1px solid #e5ece3;
                    ">

                        <div>
                            <strong>TillCheck warnings</strong>
                            <p style="
                                margin-top:4px;
                                font-size:12px;
                                color:#718074;
                            ">
                                Alert me when a purchase could hurt my month.
                            </p>
                        </div>

                        <input type="checkbox" checked>

                    </label>


                    <label style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:16px;
                        padding:16px 0;
                    ">

                        <div>
                            <strong>Savings reminders</strong>
                            <p style="
                                margin-top:4px;
                                font-size:12px;
                                color:#718074;
                            ">
                                Remind me to contribute toward my goal.
                            </p>
                        </div>

                        <input type="checkbox" checked>

                    </label>

                </article>

            </section>


            <section style="margin-top:22px;">

                <article class="card card-warning">

                    <div class="card-heading">

                        <div>
                            <p class="card-label">Session</p>
                            <h3>Account Access</h3>
                        </div>

                        <div class="card-icon">
                            <i data-lucide="log-out"></i>
                        </div>

                    </div>

                    <p class="emergency-copy">
                        Sign out of LastTill on this device.
                    </p>

                    <div style="margin-top:18px;">

                        <a href="index.html" class="btn btn-secondary">
                            <i data-lucide="log-out"></i>
                            Log Out
                        </a>

                    </div>

                </article>

            </section>

        </main>

    </div>


    <script src="js/script.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
