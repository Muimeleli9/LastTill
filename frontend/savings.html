<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LastTill | Savings Goal</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">

            <a href="dashboard.html" class="brand">
                <div class="brand-logo">L</div>
                <div class="brand-name">LastTill</div>
            </a>

            <nav class="sidebar-nav">

                <a href="dashboard.html" class="nav-link">
                    <i data-lucide="layout-dashboard"></i>
                    Dashboard
                </a>

                <a href="expense.html" class="nav-link">
                    <i data-lucide="circle-plus"></i>
                    Add Expense
                </a>

                <a href="budget.html" class="nav-link">
                    <i data-lucide="wallet-cards"></i>
                    Budget
                </a>

                <a href="tillcheck.html" class="nav-link">
                    <i data-lucide="circle-check-big"></i>
                    TillCheck
                </a>

                <a href="savings.html" class="nav-link active">
                    <i data-lucide="target"></i>
                    Savings Goal
                </a>

                <a href="emergency.html" class="nav-link">
                    <i data-lucide="shield-plus"></i>
                    Emergency Fund
                </a>

            </nav>


            <div class="profile-menu-wrapper">

                <button class="sidebar-profile" id="profileButton">

                    <div class="profile-avatar">R</div>

                    <div class="profile-details">
                        <strong>Rita Nkosi</strong>
                        <span>Student</span>
                    </div>

                    <i data-lucide="chevron-up" class="profile-chevron"></i>

                </button>

                <div class="profile-dropdown" id="profileDropdown">

                    <a href="profile.html">
                        <i data-lucide="user"></i>
                        Profile
                    </a>

                    <a href="settings.html">
                        <i data-lucide="settings"></i>
                        Settings
                    </a>

                    <a href="index.html" class="logout-link">
                        <i data-lucide="log-out"></i>
                        Log Out
                    </a>

                </div>

            </div>

        </aside>


        <main class="app-main">

            <header class="page-header">

                <div class="page-title">
                    <p class="eyebrow">Your end goal</p>
                    <h1>Savings Goal</h1>
                    <p>
                        Give your savings a purpose and track progress.
                    </p>
                </div>

                <button class="btn btn-primary">
                    <i data-lucide="plus"></i>
                    New Goal
                </button>

            </header>


            <section class="content-grid-2">

                <article class="card card-green">

                    <div class="card-heading">

                        <div>
                            <p class="card-label">Current goal</p>
                            <h3>Headphones</h3>
                        </div>

                        <div class="card-icon">
                            <i data-lucide="headphones"></i>
                        </div>

                    </div>

                    <div class="goal-number">
                        <strong>R300</strong>
                        <span>saved of R2,000</span>
                    </div>

                    <div class="progress-track">
                        <div class="progress-fill" style="width:15%;"></div>
                    </div>

                    <p class="goal-note">
                        You are 15% of the way there.
                    </p>

                </article>


                <article class="card">

                    <div class="card-heading">

                        <div>
                            <p class="card-label">Make progress</p>
                            <h3>Add to Savings</h3>
                        </div>

                    </div>

                    <div class="form-group">

                        <label>
                            Amount to save
                        </label>

                        <input
                            class="form-control"
                            type="number"
                            placeholder="R100">

                    </div>

                    <div class="form-actions">

                        <button class="btn btn-primary btn-full">
                            <i data-lucide="plus"></i>
                            Add to Goal
                        </button>

                    </div>

                </article>

            </section>

        </main>

    </div>


    <script src="js/script.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
