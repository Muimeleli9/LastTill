<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>LastTill | Verify Account</title>
  <script>
    try {
      var savedTheme = localStorage.getItem('lasttill.theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (prefersDark ? 'dark' : 'light');
    } catch (error) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/script.js"></script>
</head>
<body data-page="auth-callback">
  <noscript><p class="feedback feedback-error">Enable JavaScript to verify your account.</p></noscript>
  <main class="auth-page"><section class="auth-shell">
    <div class="auth-top"><a href="login.html" class="back-link">← Log In</a><div class="welcome-top"><a href="index.html" class="brand"><div class="brand-logo">L</div><div class="brand-name">LastTill</div></a><button class="theme-toggle theme-toggle-compact" type="button" aria-pressed="false" aria-label="Switch to dark mode"><i data-lucide="moon" class="icon-moon"></i><i data-lucide="sun" class="icon-sun"></i></button></div></div>
    <div class="auth-content" id="auth-content"><h1>Verifying your account</h1><p>Keep this page open while we verify your link.</p><div id="feedback" tabindex="-1" hidden aria-live="polite"></div></div>
  </section></main>
</body>
</html>
