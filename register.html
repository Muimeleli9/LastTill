<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LastTill | Sign Up</title>

    <script>
        try {
            var savedTheme = localStorage.getItem('lasttill.theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (prefersDark ? 'dark' : 'light');
        } catch (error) {
            document.documentElement.dataset.theme = 'light';
        }
    </script>
  <script type="module" crossorigin src="./assets/script-D4wmLxM_.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/script-DS4wHRfv.css">
</head>

<body data-page="register">
    <noscript><p class="feedback feedback-error">Enable JavaScript to use LastTill securely.</p></noscript>

    <main class="auth-page">

        <section class="auth-shell">

            <div class="auth-top">

                <a href="index.html" class="back-link">
                    <i data-lucide="arrow-left"></i>
                    Back
                </a>

                <div class="welcome-top">

                    <a href="index.html" class="brand">
                        <div class="brand-logo">L</div>
                        <div class="brand-name">LastTill</div>
                    </a>

                    <button class="theme-toggle theme-toggle-compact" type="button" aria-pressed="false" aria-label="Switch to dark mode">
                        <i data-lucide="moon" class="icon-moon"></i>
                        <i data-lucide="sun" class="icon-sun"></i>
                    </button>

                </div>

            </div>


            <div class="auth-content" id="auth-content"><h1>Sign Up</h1><p>Loading secure registration…</p><div id="feedback" tabindex="-1" hidden aria-live="polite"></div></div>

        </section>

    </main>

</body>

</html>
